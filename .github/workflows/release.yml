name: Release
on:
  push:
    branches: ['release/v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      # Signed with the debug key: fine for testing, not for the Play Store.
      - run: flutter build apk --release
      - run: echo "VERSION=${GITHUB_REF_NAME#release/}" >> "$GITHUB_ENV"
      - run: mv build/app/outputs/flutter-apk/app-release.apk investor-game-${{ env.VERSION }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: investor-game-${{ env.VERSION }}.apk
          generate_release_notes: true
